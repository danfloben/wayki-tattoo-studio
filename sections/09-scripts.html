  <!-- JAVASCRIPT                              -->
  <!-- ═══════════════════════════════════════ -->
  <script>
    // ── Hero slideshow ────────────────────────
    (function () {
      const slides = document.querySelectorAll('.hero-slide');
      if (!slides.length) return;
      let idx = 0;
      setInterval(() => {
        slides[idx].classList.remove('active');
        idx = (idx + 1) % slides.length;
        slides[idx].classList.add('active');
      }, 5000);
    })();

    // ── Navbar scroll effect ──────────────────
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    // ── Active nav link on scroll ─────────────
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-link');
    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(link => {
            const isActive = link.getAttribute('href') === '#' + entry.target.id;
            link.classList.toggle('active', isActive);
          });
        }
      });
    }, { threshold: 0.4 });
    sections.forEach(s => sectionObserver.observe(s));

    // ── Scroll to top button ──────────────────
    const scrollTopBtn = document.getElementById('scroll-top');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });

    // ── Mobile menu ───────────────────────────
    const mobileMenu = document.getElementById('mob-menu');

    function openMobileMenu() {
      mobileMenu.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
    }

    // ── Scroll reveal ─────────────────────────
    const revealEls = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    revealEls.forEach(el => revealObserver.observe(el));

    // ── Form submit → WhatsApp ────────────────
    function handleSubmit(e) {
      e.preventDefault();
      const data   = new FormData(e.target);
      const nombre = data.get('nombre') || '';
      const idea   = data.get('idea')   || '';
      const msg    = encodeURIComponent(
        `Hola Wayki Tattoo! Soy ${nombre}. ${idea ? 'Mi idea: ' + idea : 'Quiero consultar sobre una cita.'}`
      );
      window.open(`https://wa.me/51993054099?text=${msg}`, '_blank');
      document.getElementById('form-success').style.display = 'block';
      e.target.reset();
    }

    // ── Portfolio filter ──────────────────────
    document.querySelectorAll('.port-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.port-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.port-item').forEach(item => {
          const match = filter === 'all' || item.dataset.style === filter || item.dataset.style === 'all';
          item.classList.toggle('hidden', !match);
        });
      });
    });

    // ── Smooth scroll ─────────────────────────
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', (e) => {
        const target = document.querySelector(a.getAttribute('href'));
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });

    // ── i18n engine ───────────────────────────
    let currentLang = localStorage.getItem('wayki-lang') || 'es';

    function applyLang() {
      const t = (typeof i18n !== 'undefined' && i18n[currentLang]) ? i18n[currentLang] : null;
      if (!t) return;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key] === undefined) return;
        // Title values include a leading '/' meant for the styled slash span — strip it here
        // since the slash lives in its own <span class="slash"> in the HTML
        let val = t[key];
        if (val.startsWith('/')) val = val.slice(1);
        el.innerHTML = val;
      });

      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.dataset.i18nPh;
        if (t[key] !== undefined) el.placeholder = t[key];
      });

      document.documentElement.lang = currentLang;

      // Sync all lang buttons active state
      document.querySelectorAll('.lang-opt').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });

      // Sync lang display labels (desktop + móvil)
      const label = document.getElementById('lang-current');
      if (label) label.textContent = currentLang.toUpperCase();
      const labelMobile = document.getElementById('lang-mobile-current');
      if (labelMobile) labelMobile.textContent = currentLang.toUpperCase();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('wayki-lang', lang);
      applyLang();
      const menu    = document.getElementById('lang-menu');
      const mobMenu = document.getElementById('mob-lang-menu');
      if (menu)    menu.style.display    = 'none';
      if (mobMenu) mobMenu.style.display = 'none';
    }

    function toggleLangMenu() {
      const menu = document.getElementById('lang-menu');
      if (!menu) return;
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    function toggleMobLangMenu() {
      const menu = document.getElementById('mob-lang-menu');
      if (!menu) return;
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    // Cicla idiomas en el botón móvil (ES→EN→IT→FR→DE→ES)
    const langOrder = ['es', 'en', 'it', 'fr', 'de'];
    function cycleLang() {
      const next = langOrder[(langOrder.indexOf(currentLang) + 1) % langOrder.length];
      setLang(next);
    }

    // Close lang dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      const switcher = document.getElementById('nb-lang-wrap');
      const menu     = document.getElementById('lang-menu');
      if (menu && switcher && !switcher.contains(e.target)) {
        menu.style.display = 'none';
      }
      const mobBtn  = document.getElementById('nb-lang-mob');
      const mobMenu = document.getElementById('mob-lang-menu');
      if (mobMenu && mobBtn && !mobBtn.closest('div').contains(e.target)) {
        mobMenu.style.display = 'none';
      }
    });

    // Sync botón móvil al cargar
    const mobileLangLabel = document.getElementById('lang-mobile-current');
    if (mobileLangLabel) mobileLangLabel.textContent = currentLang.toUpperCase();

    // Apply saved language on load
    applyLang();
  </script>
</body>
</html>
